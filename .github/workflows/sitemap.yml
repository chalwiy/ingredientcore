name: Update sitemap and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingredientcore-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate and check single multilingual sitemap
        run: node .github/scripts/update-sitemap.mjs .
      - uses: actions/configure-pages@v5
      - name: Prepare public website only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ingredientcore-public"
          rsync -a --exclude='.*' --exclude='建站过程/' --exclude='本地语言翻译模型*/' --exclude='node_modules/' --exclude='README.md' ./ "$RUNNER_TEMP/ingredientcore-public/"
          touch "$RUNNER_TEMP/ingredientcore-public/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ingredientcore-public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked website and sitemap together
        id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/indexnow.yml
    with:
      before: ${{ github.event.before || '' }}
      after: ${{ github.sha }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
