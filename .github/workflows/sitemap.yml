name: Update sitemap
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/scripts/*.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - '.github/workflows/*.yml'
  workflow_dispatch:
permissions: {}
jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      before: ${{ steps.context.outputs.before }}
      after: ${{ steps.context.outputs.after }}
    steps:
      - name: Record original push range
        id: context
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate sitemap from published HTML
        run: node .github/scripts/update-sitemap.mjs .
      - name: Commit changed sitemap
        id: update
        shell: bash
        run: |
          set -euo pipefail
          if [ -f sitemap.xml ] && git ls-files --error-unmatch sitemap.xml >/dev/null 2>&1 && git diff --quiet -- sitemap.xml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sitemap is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Update sitemap automatically [skip ci]'
          pushed=false
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git fetch origin main
            git reset --hard origin/main
            node .github/scripts/update-sitemap.mjs .
            git add sitemap.xml
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Update sitemap automatically [skip ci]'
          done
          if [ "$pushed" != true ]; then echo 'Could not update main after concurrent pushes'; exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish changed sitemap from branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/ingredientcore-pages-response.json -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            if [ "$code" = '201' ] || [ "$code" = '202' ]; then
              echo 'GitHub Pages rebuild requested.'
              exit 0
            fi
            if [ "$code" = '409' ]; then sleep 10; continue; fi
            echo "Pages rebuild failed: HTTP $code. Confirm Settings → Pages → Deploy from a branch → main /(root)."
            cat /tmp/ingredientcore-pages-response.json
            exit 1
          done
          echo 'Pages remained busy; retry the workflow after the current deployment.'
          exit 1
  indexnow:
    needs: sitemap
    permissions:
      contents: read
    uses: ./.github/workflows/indexnow.yml
    with:
      before: ${{ needs.sitemap.outputs.before }}
      after: ${{ needs.sitemap.outputs.after }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
