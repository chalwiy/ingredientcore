name: Submit URLs to IndexNow

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 60

      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          SITEMAP="https://www.ingredientcore.com/sitemap.xml"
          HOST="www.ingredientcore.com"
          KEY="7b987908745143be9c03ef14fe4cb3de"

          curl -s "$SITEMAP" \
            | grep -oP '(?<=<loc>).*?(?=</loc>)' \
            > urls.txt

          echo "Found $(wc -l < urls.txt) URLs"

          python3 <<'PY'
          import json

          with open("urls.txt", "r") as f:
              urls = [line.strip() for line in f if line.strip()]

          payload = {
              "host": "www.ingredientcore.com",
              "key": "7b987908745143be9c03ef14fe4cb3de",
              "urlList": urls
          }

          with open("indexnow.json", "w") as f:
              json.dump(payload, f)
          PY

          curl -i \
            -X POST \
            "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json
