name: Submit URLs to IndexNow
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      before:
        type: string
        default: ''
      after:
        type: string
        default: ''
      full:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate current sitemap locally
        run: node .github/scripts/update-sitemap.mjs .
      - name: Validate key and submit URLs
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full }}
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
        run: node .github/scripts/indexnow.mjs
